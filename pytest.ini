[pytest]
# test_escrow_e2e.py is a live-server script (localhost:8001 + PostgreSQL from .env)
# that executes at import time; it must never be collected by the isolated suite.
testpaths = tests
addopts = -q -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore::sqlalchemy.exc.SAWarning
